Không phải trong VPS. Chỉ có bước tạo khóa SSH là chạy trong VPS. Các bước còn lại làm ở máy Windows của bạn hoặc trên trang GitHub.

Việc	Làm ở đâu
Copy ci.yml, cd.yml vào .github/workflows/, rồi git add, git commit, git push	Máy Windows, trong thư mục repo (Git Bash)
Tạo khóa SSH (ssh-keygen ..., cat ... >> authorized_keys)	VPS (SSH vào root@42.96.2.15)
Thêm 3 secret VPS_HOST, VPS_USER, VPS_SSH_KEY	Trang GitHub (Settings → Secrets and variables → Actions)
Bấm Run workflow cho CD	Trang GitHub (tab Actions)
CI không cần thiết lập gì thêm. Bạn chỉ cần làm bước đầu tiên: đặt hai file vào repo rồi push, và tab Actions trên GitHub sẽ tự hiện kết quả chạy.

Nếu chỉ muốn có CI cho kịp bài, bạn bỏ qua hết phần tạo khóa SSH và secret. Các bước đó chỉ cần khi bạn muốn dùng CD.

Chi tiết bước đầu trên máy Windows:

Mở Git Bash trong thư mục repo (nơi có docker-compose.prod.yml).
Tạo thư mục và đặt file vào:
bash
   mkdir -p .github/workflows
Rồi chép hai file ci.yml và cd.yml mình đã gửi vào thư mục .github/workflows.
3. Đẩy lên GitHub:

bash
   git add .github
   git commit -m "ci: add GitHub Actions CI and CD"
   git push
Vài phút sau, vào repo trên GitHub, mở tab Actions, bạn sẽ thấy workflow “CI” đang chạy hoặc đã xong. Nếu có lỗi, bạn dán nội dung vào đây.

ADMIN@MSI MINGW64 /
$

Bạn đang ở thư mục gốc / của Git Bash, chưa phải thư mục repo. Cần cd vào đúng thư mục chứa dự án trước.

Cách 1: nếu bạn nhớ nơi đã clone repo. Ví dụ nó nằm ở C:\Users\ADMIN\Du-An-MD05, thì gõ:

bash
cd /c/Users/ADMIN/Du-An-MD05
Trong Git Bash, ổ C:\ viết là /c/, và dùng dấu / thay cho \.

Cách 2: nếu không nhớ nó ở đâu. Tìm thư mục tên Du-An-MD05 hoặc tên gần giống:

bash
find /c/Users/ADMIN -maxdepth 3 -name ".git" -type d 2>/dev/null
Kết quả sẽ có dạng /c/Users/ADMIN/Desktop/Du-An/.git. Bỏ phần /.git ở cuối là ra đường dẫn của repo.

Kiểm tra bạn đã vào đúng chỗ. Sau khi cd, chạy:

bash
ls
git remote -v
Bạn phải thấy docker-compose.prod.yml, auth-service, README.md..., và dòng remote có Khac-Hai/Du-An-MD05.

Cách thêm file nhanh nhất. Mở thư mục repo trong File Explorer, tạo thư mục .github, vào trong tạo thư mục workflows, rồi chép ci.yml và cd.yml vào đó. Windows không cho tạo tên bắt đầu bằng dấu chấm bằng giao diện, nên bạn dùng Git Bash:

bash
mkdir -p .github/workflows
Sau đó đẩy lên GitHub:

bash
git add .github
git commit -m "ci: add GitHub Actions CI and CD"
git push
Bạn chạy ls và git remote -v rồi dán kết quả vào đây nếu chưa chắc đã vào đúng thư mục.

trên máy tính tôi chưa clone vì tôi làm bản chính trên máy tính mà

Xác định xem thư mục làm việc có phải là git repo không.
Xác định xem thư mục làm việc có phải là git repo không.
Không sao, bạn có hai cách và cả hai đều không cần clone. Cách 1 (làm trên web GitHub) là đơn giản nhất.

Cách 1: tạo file ngay trên web GitHub (không cần Git Bash)

Mở https://github.com/Khac-Hai/Du-An-MD05.
Bấm Add file → Create new file.
Ở ô tên file, gõ đúng .github/workflows/ci.yml. Khi bạn gõ dấu /, GitHub tự tạo thư mục.
Mở file ci.yml mình đã gửi, sao chép toàn bộ nội dung, rồi dán vào ô soạn thảo.
Bấm Commit changes (giữ nhánh main).
Lặp lại với .github/workflows/cd.yml.
Sau khi commit, vào tab Actions, CI sẽ tự chạy.

Cách 2: dùng Git Bash trong thư mục dự án có sẵn trên máy bạn

Nếu thư mục dự án của bạn đã là một repo Git (từ lúc bạn “up git”), chỉ cần vào đúng thư mục đó. Ví dụ:

bash
cd /c/Users/ADMIN/<tên-thư-mục-dự-án>
git status
Nếu git status chạy bình thường (không báo not a git repository), thì làm tiếp:

bash
mkdir -p .github/workflows
# chép ci.yml, cd.yml vào thư mục này
git add .github
git commit -m "ci: add GitHub Actions CI and CD"
git push
Nếu báo not a git repository, nghĩa là bạn đã đưa code lên GitHub bằng cách khác. Khi đó dùng Cách 1.

Trường hợp git push bị từ chối vì repo trên GitHub đã có commit mới hơn máy bạn, hãy chạy git pull --rebase trước rồi push lại.

Bạn làm cách nào cũng được. Xong thì chụp màn hình tab Actions gửi mình xem CI có xanh không.





Ci · YML
name: CI
 
# Chạy mỗi khi push lên main hoặc mở Pull Request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
 
permissions:
  contents: read
 
jobs:
  # 1) Biên dịch + chạy test (nếu có) cho từng service Java.
  build-java:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - order-service
          - payment-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Maven verify
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp verify
 
  # 2) Kiểm tra từng Dockerfile build được (không push image đi đâu).
  docker-build:
    name: Docker ${{ matrix.service }}
    needs: build-java
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - order-service
          - payment-service
          - notification-service
          - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: omnichannel-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
 
  # 3) Kiểm tra cú pháp docker-compose production với file env mẫu.
  compose-validate:
    name: Validate compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.prod.yml
        run: |
          cp .env.production.example .env
          docker compose -f docker-compose.prod.yml --env-file .env config -q
          echo "docker-compose.prod.yml hợp lệ"
 
